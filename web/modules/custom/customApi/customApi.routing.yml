custom_api.message:
  path: '/api/custom/submit'
  defaults:
    _controller: '\Drupal\customApi\Controller\CustomApiController::submit'
  requirements:
    _permission: 'access content'

custom_api.search:
  path: '/api/custom/search'
  defaults:
    _controller: '\Drupal\customApi\Controller\CustomApiController::search'
  requirements:
    _permission: 'access content'

custom_api.lieux:
  path: '/api/custom/lieux'
  defaults:
    _controller: '\Drupal\customApi\Controller\CustomApiController::getLieux'
  requirements:
    _permission: 'access content'
