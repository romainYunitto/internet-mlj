id: typo3_files
label: '1 - Migration des fichiers (sys_file)'
source:
  plugin: table
  key: typo3
  table_name: sys_file
  id_fields:
    uid:
      type: integer
process:
  # Migration physique des fichiers depuis le dossier tmp/files/data/fileadmin/
  uri:
    plugin: file_copy
    source:
      - identifier
    file_exists: 'rename'
    move: false
    reuse: true
    destination_path_property: 'filepath'
  filepath:
    plugin: concat
    source:
      - constants/typo3_files_base
      - identifier
  filename: name
  filesize: size
  filemime: mime_type
  status:
    plugin: default_value
    default_value: 1
destination:
  plugin: 'entity:file'
constants:
  typo3_files_base: '/var/www/html/tmp/files/data/fileadmin/'  # Chemin vers les fichiers TYPO3 extraits
