id: typo3_files
label: '1 - Migration des fichiers (sys_file)'
source:
  plugin: table
  key: typo3
  table_name: sys_file
  id_fields:
    uid:
      type: integer
process:
  # Pour le test, on crée juste l'entité sans copier le fichier physique
  uri:
    plugin: default_value
    default_value: 'public://migrated/placeholder.txt'
  filename: name
destination:
  plugin: 'entity:file'
constants:
  file_source_path: '/private/typo3_files' # Chemin vers la copie locale de fileadmin
