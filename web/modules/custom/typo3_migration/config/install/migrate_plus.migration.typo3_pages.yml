id: typo3_pages
label: '2 - Migration des pages (contenu agrégé)'
source:
  plugin: table
  key: typo3
  table_name: migration_typo3_pages
  id_fields:
    uid:
      type: integer
process:
  type: { plugin: default_value, default_value: page }
  title: title
  status:
    plugin: static_map
    source: hidden
    map:
      0: 1  # Non caché = publié
      1: 0  # Caché = non publié
    default_value: 1
  'body/value':
    plugin: html_clean
    source: full_body
  'body/format': { plugin: default_value, default_value: full_html }
  # On laisse Pathauto générer les alias automatiquement
  # path/alias: slug
  'field_image/target_id':
    plugin: migration_lookup
    migration: typo3_files
    source: file_uid
  'field_image/alt': title
destination:
  plugin: 'entity:node'
migration_dependencies:
  required: [typo3_files]
