id: typo3_articles
label: '3 - Migration des articles (via vue SQL)'
source:
  plugin: table
  table: drupal_migration_articles # Pointe vers votre nouvelle vue
  key: migrate
  ids:
    uid:
      type: integer
  columns:
    - uid: uid
    - title: title
    - bodytext: bodytext
    - teaser: teaser
    - slug: slug
    - file_uid: file_uid
process:
  type: { plugin: default_value, default_value: article }
  title: title
  status: { plugin: default_value, default_value: 1 }
  'body/value': { plugin: html_clean, source: bodytext }
  'body/summary': teaser
  'body/format': { plugin: default_value, default_value: full_html }
  path/alias: slug
  path/pathauto: { plugin: default_value, default_value: 0 }
  'field_image/target_id':
    plugin: migration_lookup
    migration: typo3_files
    source: file_uid
  'field_image/alt': title
destination:
  plugin: 'entity:node'
migration_dependencies:
  required:
    - typo3_files
