services:
  mariadb:
    image: wodby/mariadb:11.4-3.32.2
    container_name: "prod-${PROJECT_NAME}_mariadb"
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_prod:/var/lib/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  php:
    image: wodby/drupal-php:${PHP_TAG}
    container_name: "prod-${PROJECT_NAME}_php"
    depends_on:
      mariadb:
        condition: service_healthy
    user: root
    restart: unless-stopped
    command: sh -c "chown -R ${MY_UID:-1000}:${MY_GID:-1000} /var/www/html && /docker-entrypoint.sh php-fpm"
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DRIVER: ${DB_DRIVER}
      PHP_FPM_USER: wodby
      PHP_FPM_GROUP: wodby
    networks:
      - default
    volumes:
      - ${PROJECT_ROOT}:/var/www/html:cached
      - files_prod:/var/www/html/web/sites/default/files

  nginx:
    image: wodby/nginx:1.29-5.44.2
    container_name: "prod-${PROJECT_NAME}_nginx"
    restart: unless-stopped
    depends_on:
      - php
    environment:
      NGINX_STATIC_OPEN_FILE_CACHE: "off"
      NGINX_ERROR_LOG_LEVEL: ${NGINX_LOG_LEVEL:-error}
      NGINX_BACKEND_HOST: php
      NGINX_SERVER_ROOT: /var/www/html/web
      NGINX_VHOST_PRESET: drupal11
      NGINX_SERVER_NAME: ${SERVER_NAME:-"_"}
    volumes:
      - ${PROJECT_ROOT}:/var/www/html:cached
      - files_prod:/var/www/html/web/sites/default/files
    networks:
      - default
      - proxy_network

volumes:
  db_prod:
    name: internet-mlj_production_db_prod
  files_prod:
    name: internet-mlj_production_files_prod

networks:
  default:
    driver: bridge
  proxy_network:
    name: internet-mlj_production_default
    external: true
