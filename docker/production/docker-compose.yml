services:
  mariadb:
    image: wodby/mariadb:11.4-3.32.2
    container_name: "mariadb_prod"
    stop_grace_period: 30s
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_prod:/var/lib/mysql

  php:
    image: wodby/drupal-php:8.3-4.69.2  # Version stable pour la production
    container_name: "php_prod"
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}  
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_DRIVER: ${DB_DRIVER}
      PHP_FPM_USER: wodby
      PHP_FPM_GROUP: wodby
    volumes:
      - ${PROJECT_ROOT}:/var/www/html:cached
      - files_prod:/var/www/html/web/sites/default/files

  nginx:
    image: wodby/nginx:1.29-5.44.2
    container_name: "nginx_prod"
    restart: unless-stopped
    depends_on:
      - php
    environment:
      NGINX_STATIC_OPEN_FILE_CACHE: "off"
      NGINX_ERROR_LOG_LEVEL: ${NGINX_LOG_LEVEL:-error}
      NGINX_BACKEND_HOST: php
      NGINX_SERVER_ROOT: /var/www/html/web
      NGINX_VHOST_PRESET: drupal11
      NGINX_SERVER_NAME: ${SERVER_NAME:-"_"}
    volumes:
      - ${PROJECT_ROOT}:/var/www/html:cached
      - files_prod:/var/www/html/web/sites/default/files
    ports:
      - "${NGINX_PORT}:80"

volumes:
  db_prod:
  files_prod: