services:
  nginx-proxy:
    container_name: nginx-ssl-proxy-prod
  ssl-proxy:
    image: nginx:alpine
    container_name: ssl_proxy_global
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy-network
      - drupal-network
      - intranet-network

networks:
  proxy-network:
    driver: bridge
  drupal-network:
    external: true
    name: internet-mlj_default
  intranet-network:
    external: true
    name: infra-mlj_drupal
