services:
  ssl-proxy:
    image: nginx:alpine
    container_name: ssl_proxy_production
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /data/docker/dockermantes/certs:/etc/nginx/ssl:ro
    networks:
      - proxy-network
      - drupal-network
      - intranet-network
      - nextjs-network

networks:
  proxy-network:
    driver: bridge
  drupal-network:
    external: true
    name: internet-mlj_production_default
  intranet-network:
    external: true
    name: intramlj_production_default
  nextjs-network:
    external: true
    name: mlj-web_production_default
