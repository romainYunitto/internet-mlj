events {
    worker_connections 1024;
}

http {
    client_max_body_size 2000M;
    # Configuration SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de sécurité
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Redirection HTTP vers HTTPS
    server {
        listen 80;
        server_name prod-admin.manteslajolie.fr prod-site.manteslajolie.fr prod-intra.manteslajolie.fr;
        return 301 https://$server_name$request_uri;
    }

    # 1. NextJS Front-office (domaine prod-site.manteslajolie.fr)
    server {
        listen 443 ssl http2;
        server_name prod-site.manteslajolie.fr;
        client_max_body_size 2000M;

        ssl_certificate /etc/nginx/ssl/wildcard.manteslajolie.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.manteslajolie.fr.key;

        location / {
            proxy_pass http://next-app-production:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Configuration pour NextJS
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # 2. Drupal Internet Back-office (prod-admin.manteslajolie.fr)
    server {
        listen 443 ssl http2;
        server_name prod-admin.manteslajolie.fr;
        client_max_body_size 2000M;

        ssl_certificate /etc/nginx/ssl/wildcard.manteslajolie.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.manteslajolie.fr.key;

        location / {
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_pass http://prod-internet-mlj_nginx:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Configuration pour Drupal
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # Gestion des fichiers statiques Drupal
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://prod-internet-mlj_nginx:80;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

