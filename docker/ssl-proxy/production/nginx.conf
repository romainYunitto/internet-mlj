events {
    worker_connections 1024;
}

http {
    # Configuration SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de sécurité
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Redirection HTTP vers HTTPS
    server {
        listen 80;
        server_name admin.manteslajolie.fr www.manteslajolie.fr intra.manteslajolie.fr;
        return 301 https://$server_name$request_uri;
    }

    # 1. NextJS Front-office (domaine www.manteslajolie.fr)
    server {
        listen 443 ssl http2;
        server_name www.manteslajolie.fr;

        ssl_certificate /etc/nginx/ssl/wildcard.manteslajolie.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.manteslajolie.fr.key;

        location / {
            proxy_pass http://next-app-production:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    # 2. Drupal Internet Back-office (admin.manteslajolie.fr)
    server {
        listen 443 ssl http2;
        server_name admin.manteslajolie.fr;

        ssl_certificate /etc/nginx/ssl/wildcard.manteslajolie.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.manteslajolie.fr.key;

        location / {
            proxy_pass http://prod-internet-mlj_nginx:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }

    # 3. Drupal Intranet (intra.manteslajolie.fr)
    server {
        listen 443 ssl http2;
        server_name intra.manteslajolie.fr;

        ssl_certificate /etc/nginx/ssl/wildcard.manteslajolie.fr.crt;
        ssl_certificate_key /etc/nginx/ssl/wildcard.manteslajolie.fr.key;

        location / {
            proxy_pass http://prod-intranet_nginx:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
        }
    }
}