events {
    worker_connections 1024;
}

http {
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 1. NextJS Front-office (domaine pp-site.manteslajolie.fr)
    server {
        listen 80;
        server_name pp-site.manteslajolie.fr;

        location / {
            proxy_pass http://next-app-stagging:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 2. Drupal Internet Back-office (pp-admin.manteslajolie.fr)
    server {
        listen 80;
        server_name pp-admin.manteslajolie.fr;

        location / {
            proxy_pass http://preprod-internet-mlj_nginx:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # 3. Drupal Intranet (pp-intra.manteslajolie.fr)
    server {
        listen 80;
        server_name pp-intra.manteslajolie.fr;

        location / {
            proxy_pass http://preprod-intranet-preprod_nginx_v2:80;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}