services:
  ssl-proxy:
    image: nginx:alpine
    container_name: ssl_proxy_preprod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy-network
      - drupal-network
      - intranet-network
      - nextjs-network

networks:
  proxy-network:
    driver: bridge
  drupal-network:
    external: true
    name: internet-mlj_default
  intranet-network:
    external: true
    name: infra-mlj_drupal
  nextjs-network:
    external: true
    name: mlj-web_default