upstream nextjs_backend {
    server next-app-production:3000;
}

# Configuration temporaire HTTP pour test local
server {
    listen 80;
    server_name localhost;
    
    location / {
        proxy_pass http://nextjs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Configuration pour les autres domaines - réponse temporaire
server {
    listen 80 default_server;
    server_name _;
    return 503 "Service temporairement indisponible - En cours de déploiement";
}
