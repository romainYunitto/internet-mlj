upstream nextjs_backend {
    server host.docker.internal:3000;
}

upstream intranet_backend {
    server host.docker.internal:8003;
}

upstream admin_backend {
    server host.docker.internal:8005;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name www.manteslajolie.fr intranet.manteslajolie.fr admin.manteslajolie.fr;
    return 301 https://$server_name$request_uri;
}

# MLJ-web (Site public Next.js)
server {
    listen 443 ssl http2;
    server_name www.manteslajolie.fr;

    ssl_certificate /etc/nginx/ssl/wildcard.manteslajolie.fr.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.manteslajolie.fr.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://nextjs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # WebSocket support pour Next.js
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Intranet (Drupal)
server {
    listen 443 ssl http2;
    server_name intranet.manteslajolie.fr;

    ssl_certificate /etc/nginx/ssl/wildcard.manteslajolie.fr.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.manteslajolie.fr.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://intranet_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Support pour les gros uploads Drupal
        client_max_body_size 100M;
    }
}

# Back-office Admin (Drupal)
server {
    listen 443 ssl http2;
    server_name admin.manteslajolie.fr;

    ssl_certificate /etc/nginx/ssl/wildcard.manteslajolie.fr.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.manteslajolie.fr.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://admin_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        
        # Support pour les gros uploads Drupal
        client_max_body_size 100M;
    }
}