upstream nextjs_backend {
    server next-app-production:3000;
}

upstream intranet_backend {
    server prod-intranet_nginx_v2:80;
}

upstream admin_backend {
    server prod-internet-mlj_nginx:80;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name www.manteslajolie.fr intranet.manteslajolie.fr admin.manteslajolie.fr;
    return 301 https://$server_name$request_uri;
}

# MLJ-web (Site public Next.js)
server {
    listen 443 ssl http2;
    server_name www.manteslajolie.fr;

    ssl_certificate /etc/nginx/certs/wildcard.manteslajolie.fr.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.manteslajolie.fr.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://nextjs_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Intranet (Drupal)
server {
    listen 443 ssl http2;
    server_name intranet.manteslajolie.fr;

    ssl_certificate /etc/nginx/certs/wildcard.manteslajolie.fr.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.manteslajolie.fr.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://intranet_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

